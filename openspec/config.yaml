schema: spec-driven

context: |
  Project Gridline is an optional Wayland tiling desktop session for Ubuntu.
  It is not a distribution fork and not a replacement for Ubuntu Desktop.

  Supported baseline: Ubuntu 26.04 LTS (resolute), x86_64. The baseline is a
  released series, so package availability, version and archive component are
  facts to verify against the archive rather than assumptions to carry.

  Canonical project URL: https://gridline-desktop.org. Packaging metadata and
  documentation use this host; no other domain is the project's address.

  Delivery is exclusively through Debian packages. No capability may depend on
  an install script, a post-install download, or a manual file copy.

  The stock Ubuntu GNOME session must remain installed, selectable and
  supported as a fallback at all times. Gridline is additive and removable.
  A user whose Gridline session fails must be able to recover without a
  working Gridline desktop.

  Mandatory integrations that must keep working: GDM, NetworkManager, PipeWire
  and WirePlumber, BlueZ, XDG Desktop Portals including a compatible Hyprland
  backend plus the GTK backend, Snap applications, power management covering
  suspend, resume and lid handling, session locking that survives suspend, a
  polkit authentication agent, XWayland for X11 applications, AppArmor, and
  Ubuntu security updates.

  Session locking and the polkit agent are fail-safe components: a lock failure
  must never leave an unlocked unattended session, and a missing polkit agent
  must be reported rather than left to fail privileged actions silently.

  Hyprland is the initial compositor. Compositor-specific logic stays behind an
  internal adapter boundary at a single documented path and must not rely on
  undocumented Hyprland internals.

  A future community Ubuntu Remix or ISO consumes the same packages and must
  never be the only place a core capability exists.

  Project-wide non-goals for now: Omarchy visual parity, a custom Quickshell
  shell, per-device hardware automation, an application catalogue, AI features,
  and any change that replaces or removes GNOME.

  Where Ubuntu already provides a component, the work is to keep it working and
  prove it, not to reimplement it.

  Most of the Hyprland ecosystem is in the universe component, which carries no
  Canonical security-update commitment. Every component decision records whether
  the package is in main or universe, because that distinction is a support fact,
  not packaging trivia, and it is the central obstacle to any future flavor
  candidacy.

  Archive packages own their own files. Where Gridline must influence a
  third-party component's behavior, it does so with a Gridline-named drop-in file
  in a directory that supports one, never by modifying or overwriting a file
  another package owns.

rules:
  proposal:
    - Always state what is out of scope
    - State explicitly whether the change ships implementation or only
      documentation and specs
  specs:
    - Every requirement must be verifiable on the supported baseline
    - Do not write an active requirement for something this change does not
      deliver; mark it reserved or defer it to the change that delivers it
    - Every requirement that can leave the desktop unusable must state the
      fallback behavior
    - Every requirement whose failure has a security consequence must state the
      fail-safe behavior
    - A requirement that depends on a third-party component honoring Gridline's
      desktop identity must name the file or mechanism that makes it do so
  tasks:
    - A foundation or definition change produces documentation and specs only,
      never package builds, implementation, or hardware validation tasks
    - Every task must name how it is verified
    - Do not duplicate work that belongs to a later planned change

operations:
  apply:
    guidance:
      - Never modify GDM, PAM, NetworkManager, PipeWire, or polkit system
        configuration outside of Gridline-owned paths
      - Prefer Ubuntu archive packages over third-party sources
