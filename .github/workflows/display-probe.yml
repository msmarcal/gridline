# Can a compositor be given a display on a hosted runner, and at what cost?
#
# Answered, on 2026-11-08, and kept so it can be asked again. It is not part
# of the checks and never runs on a push: dispatch it by hand.
#
# WHAT IT FOUND
#
#   A display device is obtainable and cheap. The runner carries
#   /dev/dri/card1 before anything is loaded, has passwordless sudo, and ships
#   vkms in the Azure kernel's module tree. `modprobe vkms` loads, and card0
#   appears. The route this project had recorded as expensive is free.
#
#   The compositor still cannot start on it. With both cards present it
#   aborted: CBackend::create() failed!, a core dump, zero Wayland sockets.
#
#   So the two failures are different. A headless backend fails with "Cannot
#   open backend: no allocator available"; vkms gets a real DRM device and
#   fails at backend creation anyway. What a runner cannot provide is not a
#   card - it is whatever the backend needs behind one.
#
# WHY IT IS KEPT RATHER THAN DELETED
#
#   The header first said this should be deleted once it had answered. It is
#   kept because the answer is specific enough to expire: a change to the
#   compositor, the kernel, or the runner image could each turn it over, and
#   re-asking costs one dispatch against writing this again from nothing.
#
# The steps are deliberately tolerant: each records what happened and the job
# does not fail. A probe that goes red teaches nothing beyond "no", while one
# that reports what it found distinguishes "the module is absent" from "the
# module loads and the compositor still refuses", and those have different
# answers.

name: display probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-26.04

    # The compositor step carries its own eight minutes. This bounds the job
    # as a whole, because the step that hangs next will be a different one.
    timeout-minutes: 20

    steps:
      - name: What kernel and what privileges
        run: |
          echo "kernel: $(uname -r)"
          echo "virt:   $(systemd-detect-virt || true)"
          echo "root:   $(sudo -n true 2>/dev/null && echo 'passwordless sudo' || echo 'no')"
          echo "/dev/dri:"
          ls -la /dev/dri 2>&1 || echo "  absent"
          echo "/dev/kvm: $([ -e /dev/kvm ] && echo present || echo absent)"

      - name: Is a virtual KMS module available at all
        run: |
          # Present in the kernel's module tree is a different answer from
          # loadable, and both differ from "built in".
          modinfo vkms 2>&1 | head -5 || echo "modinfo: no vkms module in this kernel's tree"
          grep -c vkms /lib/modules/"$(uname -r)"/modules.builtin 2>/dev/null \
            | sed 's/^/builtin matches: /' || true

      - name: Try to load it
        run: |
          # The status is captured on its own line rather than read inside the
          # message, where $? would report the echo that preceded it.
          sudo modprobe vkms 2>&1 && status=0 || status=$?
          if [ "$status" = 0 ]; then
            echo "modprobe vkms: loaded"
          else
            echo "modprobe vkms: refused or failed, status $status"
          fi
          echo "/dev/dri after:"
          ls -la /dev/dri 2>&1 || echo "  still absent"

      - name: If there is a card, try the compositor on it
        timeout-minutes: 8
        run: |
          # Any card, not card0. The runner already carries card1 before
          # anything is loaded, and the first version of this step asked for
          # card0 by name - which is the sort of thing that reads as "no
          # display available" when the truth is "the display is numbered
          # differently".
          cards=$(ls /dev/dri/card* 2>/dev/null | tr '\n' ' ')
          if [ -z "$cards" ]; then
            echo "no card, so the compositor was not attempted"
            exit 0
          fi
          echo "cards: $cards"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hyprland
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo loginctl enable-linger "$USER"
          sleep 3
          # Written to a file rather than piped, and killed rather than asked.
          # The first version was `timeout 15 Hyprland | head -30`, which hung
          # for fifteen minutes: timeout's SIGTERM did not end it, and head
          # went on waiting for a pipe that nothing closed. A probe that hangs
          # costs runner minutes and answers nothing.
          timeout --kill-after=5 15 Hyprland >/tmp/hypr.log 2>&1 || true
          echo "--- what the compositor said:"
          head -40 /tmp/hypr.log || true
          echo "--- wayland sockets: $(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep -c '^wayland-' || echo 0)"
