# Gridline's application launcher and command menu.
#
# One file for both, because they are one program in two modes and a user who
# restyles one means both. It is named with --config by gridline-menu rather
# than installed where the application launcher would find it on its own: its
# own package ships /etc/xdg/fuzzel/fuzzel.ini, so a file of Gridline's there
# would be overwriting a file another package owns.
#
# Every key here was taken from the shipped version's own documented list, and
# the file is checked at build time with the menu program's --check-config, which
# exits non-zero and names the line for an unknown key or an out-of-range
# value. That check exists because the wallpaper daemon accepts unknown keys in
# silence, and a configuration that is wrong in silence is how this project
# shipped a component configured with keys that did nothing.

[main]
# The bar's font, so that the two things a user sees most do not disagree.
font=Ubuntu:size=12
prompt="  "
icons-enabled=yes

# No icon-theme is named, and the omission is deliberate. Naming Yaru would
# look right on an Ubuntu desktop and would be a claim this package cannot
# keep: Yaru comes from yaru-theme-icon, which arrives with ubuntu-desktop,
# which Gridline does not declare a dependency on. Whether it should is an open
# question with a change of its own, and answering it here by assuming the
# answer is how an undeclared prerequisite becomes invisible.
#
# The cost of leaving it out is nothing measurable: with the menu program's
# own default, applications still show their icons, because they install into
# hicolor. Measured on a machine with Yaru present, so the comparison was
# available rather than assumed.

# Fifteen lines of results is the default and is more than a laptop screen
# wants above a prompt. Eight fills about a third of a 1080p screen.
lines=8
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=8

layer=overlay

[colors]
# Catppuccin Mocha, the palette the bar already uses. Not a preference: a
# menu that arrives in a different palette than the bar reads as a
# different program borrowed into the session, which is what it would be.
background=1e1e2ef5
text=cdd6f4ff
input=cdd6f4ff
prompt=6c7086ff
placeholder=6c7086ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=6c7086ff
border=89b4faff

[border]
width=2
radius=8
