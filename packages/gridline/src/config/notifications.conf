# Gridline's default notification appearance and behaviour.
#
# The colours here are literals and are stated again, rather than shared, in
# the bar's stylesheet. The coincidence is intentional and the duplication is
# the point: nothing in this file is read by another component, so a later
# theming change replaces this file whole instead of unpicking a mechanism.
#
# This component searches no system path of its own, measured against the
# binary, so there is no file placement that would make these defaults
# visible. They reach a session only because the session names this path, and
# only when the user has written none of their own.

font=Ubuntu 10
background-color=#1e1e2eff
text-color=#cdd6f4ff
border-color=#585b70ff
progress-color=over #89b4faff
border-size=1
border-radius=4
padding=10
margin=10
width=360
max-visible=5
default-timeout=5000
anchor=top-right
layer=overlay

# A critical notification is one the application asked not to be missed, so it
# is not dismissed on a timer and is marked by its border rather than only by
# its text.
[urgency=critical]
border-color=#f38ba8ff
default-timeout=0

[urgency=low]
text-color=#a6adc8ff
