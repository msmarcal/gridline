# Gridline's default wallpaper.
#
# This is the 0.8.3 configuration format, read from the source of the version
# the archive ships. It is not the syntax current examples carry: `preload`
# does not exist any more, and `wallpaper` is a category with a block rather
# than a one-line value. The component accepts an unknown key in silence, so a
# file written in the older syntax parses, reports nothing and displays
# nothing. Check a change to this file against a running session, not against
# an exit code.
#
# The image is the symlink ubuntu-wallpapers maintains, which points at the
# release's own wallpaper and therefore survives the per-release renames of
# every other file in that directory. Gridline ships the choice rather than an
# image of its own.

# The component draws its project name over the wallpaper by default. The
# session requirement that a first login presents no upstream project
# messaging is why this is off rather than left at its default of 1.
splash = 0

ipc = 1

wallpaper {
    # Empty applies to every output, including one connected later.
    monitor =
    path = /usr/share/backgrounds/ubuntu-default-greyscale-wallpaper.png
    fit_mode = cover
}
