# Gridline's entry in the compositor's configuration search path.
#
# This file exists to be short. The compositor resolves configuration by
# returning the first file it finds and stopping, with no merge, so whatever
# sits here is all that is read. Putting the defaults themselves here would mean
# a user who writes their own configuration loses every one of them at once,
# with nothing to source back.
#
# So the defaults live in a Gridline-owned file and this one pulls them in. A
# user who wants to customise copies this file into their own configuration
# directory and writes their settings after the source line. Measured on the
# baseline: the later statement wins, so their settings override the defaults
# rather than the other way round, and they keep everything they did not change.
#
# Deleting the source line discards the defaults, which is correct. A shipped
# default is something an administrator may edit and a user may decline. Making
# it unoverridable is policy, which the session-manageability capability
# specifies and which no file in a search path can deliver.

source = /etc/xdg/gridline/compositor/defaults.conf
