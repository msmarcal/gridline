# Gridline compositor defaults.
#
# This file lives inside the adapter path because its contents are the most
# compositor-specific thing the project ships: every keyword below is this
# compositor's vocabulary. It is installed into /etc/xdg by gridline-config,
# which owns shipped defaults. Those two facts are not in tension - one is about
# where the source lives, the other about which package owns the installed path.
# See docs/component-ownership.md.
#
# Nothing here names a component Gridline could swap. The terminal binding calls
# xdg-terminal-exec, the freedesktop mechanism for "the terminal this system is
# configured to use", so a user changes terminal by registering one rather than
# by editing this file. The lock binding asks logind to lock rather than running
# a locker, so a lock requested from anywhere on the system takes the same path.

# The marker. Nothing in this compositor reports which configuration file it
# loaded, so a session with Gridline's defaults and one without are otherwise
# indistinguishable at runtime. This makes the question answerable from inside
# the session without reading any file.
#
# It is set twice because one way does not reach far enough, measured rather
# than assumed. The env keyword covers processes the compositor launches
# directly, which land in the session scope. It does **not** cover anything the
# systemd user manager activates, and that includes the terminal a person
# actually opens: the one here arrives in app.slice as its own service, with the
# user manager's environment rather than the compositor's. A reader looking for
# the marker from their own shell would not find it.
#
# So the second line pushes it into the user manager too, the same way the
# launcher already does for WAYLAND_DISPLAY. The limit worth knowing: this runs
# once at startup, so anything the manager activated before it does not see the
# variable. That is a smaller gap than never reaching the terminal at all.
env = GRIDLINE_CONFIG,1
exec-once = systemctl --user set-environment GRIDLINE_CONFIG=1

# Tiling.
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    rounding = 6
}

# Focus follows the pointer without raising, so moving the mouse across a tiled
# layout does not reorder it.
input {
    follow_mouse = 1

    # Empty on purpose, and empty is not the same as absent. The session
    # launcher reads the machine's configured keyboard from logind and exports
    # XKB_DEFAULT_LAYOUT and friends, which libxkbcommon consults only when it
    # is handed no explicit names.
    #
    # Measured, all three states, on a machine configured for br/abnt2:
    #
    #   kb_layout = us     -> l "us"   English (US)          forced, wrong
    #   no kb_layout line  -> l "us"   English (US)          the compositor's
    #                                                        own default, still
    #                                                        passed explicitly
    #   kb_layout =        -> l ""     Portuguese (Brazil)   the environment
    #                                                        decides
    #
    # The middle row is why this line exists rather than being deleted. Omitting
    # it looks like deferring and is not: the compositor substitutes its own
    # default and passes that, which closes the environment path just as firmly
    # as naming a layout here would. On a machine already set to us all three
    # rows look identical, which is how the first two versions of this survived.
    #
    # A fixed layout, if ever wanted, belongs in the policy layer that
    # session-manageability specifies, set by an administrator on purpose
    # rather than by a default that silently overrides the machine.
    kb_layout =
}

# Upstream messaging. On a fresh install these are the first thing a user sees,
# and a session that opens with the state of the projects it is assembled from
# has not finished assembling. Cosmetic, and that is the whole of it.
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    # Recovery from a lock client that died. Without this the compositor holds
    # the session locked, correctly, but refuses a replacement lock client, and
    # the only way back is another TTY. See docs/security-and-manageability.md.
    allow_session_lock_restore = true

    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true

    # The two below are not cosmetic, and both are paired with a record of the
    # thing they stop reporting. Silencing a warning is not answering it, and a
    # quiet screen is how a question stops being visible to the next reader.
    #
    # The watchdog warning reports that the compositor was not started through
    # its wrapper. Whether it should be is open: the wrapper restarts what it
    # watches, and the session is required to end when its compositor exits.
    # docs/compositor-adapter.md carries the question, the owner and the three
    # measurements it needs.
    disable_watchdog_warning = true

    # The XDG environment check reports that the desktop identity is set from
    # outside. It is, deliberately: the display manager composes it from the
    # session entry and the launcher neither sets nor modifies it.
    # docs/architecture.md records that as a supersession. The alternative is to
    # make the warning accurate by discarding the identity, which costs the
    # portal mapping, the session's own name, and a requirement.
    disable_xdg_env_checks = true
}

$mod = SUPER

# Launching. Return opens a terminal because that is the binding a tiling user
# reaches for first; the project's own verification kept needing it.
bind = $mod, Return, exec, xdg-terminal-exec
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit

# Opening a program, and asking the session for one of its own actions. Both
# name a Gridline program rather than the menu it runs, which is this file's
# own rule and the reason the terminal binding above says xdg-terminal-exec:
# nothing here names a component Gridline could swap. The program decides
# whether to hand the menu Gridline's configuration, so the same binding
# behaves correctly for a user who has written their own.
#
# D and SHIFT D: the same letter one modifier apart, because they are the same
# gesture. Both were free, checked against every bind in this file rather than
# assumed - the file already binds L twice over for movement and focus, so a
# collision here would be silent and would simply take one of the two away.
bind = $mod, D, exec, /usr/libexec/gridline/gridline-menu apps
bind = $mod SHIFT, D, exec, /usr/libexec/gridline/gridline-menu commands

# The keys printed on the machine. Each names a Gridline program and never the
# tool, for the reason the terminal and lock bindings above do.
#
# The keyword is what carries the behaviour, not a field: e repeats while held
# and l acts while the session is locked. Volume and brightness get both, since
# they are held and are pressed at the lock screen; silencing a machine or
# dimming it reveals and unlocks nothing. Mute gets l only. The media keys get
# neither, deliberately: pausing is harmless, but skipping tracks on a locked
# machine is a stranger deciding what someone's music does.
bindel = , XF86AudioRaiseVolume, exec, /usr/libexec/gridline/gridline-keys volume-up
bindel = , XF86AudioLowerVolume, exec, /usr/libexec/gridline/gridline-keys volume-down
bindl = , XF86AudioMute, exec, /usr/libexec/gridline/gridline-keys mute
bindl = , XF86AudioMicMute, exec, /usr/libexec/gridline/gridline-keys mic-mute
bindel = , XF86MonBrightnessUp, exec, /usr/libexec/gridline/gridline-keys brightness-up
bindel = , XF86MonBrightnessDown, exec, /usr/libexec/gridline/gridline-keys brightness-down
bind = , XF86AudioPlay, exec, /usr/libexec/gridline/gridline-keys play-pause
bind = , XF86AudioPrev, exec, /usr/libexec/gridline/gridline-keys previous
bind = , XF86AudioNext, exec, /usr/libexec/gridline/gridline-keys next

# Locking goes through logind rather than straight to a locker, so the idle
# timeout, this key and anything else on the system all arrive by one route.
#
# Escape rather than the mnemonic L, which is taken: the vim-style focus keys
# below use H, J, K and L, and binding L twice would make one of the two
# silently lose. Leaving $mod SHIFT, L free also leaves room for the vim-style
# move-window bindings a later change will want.
bind = $mod, Escape, exec, loginctl lock-session

# Focus.
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Moving windows within the layout.
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Window state.
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, S, togglesplit

# Workspaces.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Pointer.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
