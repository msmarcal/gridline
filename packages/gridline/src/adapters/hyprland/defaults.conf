# Gridline compositor defaults.
#
# This file lives inside the adapter path because its contents are the most
# compositor-specific thing the project ships: every keyword below is this
# compositor's vocabulary. It is installed into /etc/xdg by gridline-config,
# which owns shipped defaults. Those two facts are not in tension - one is about
# where the source lives, the other about which package owns the installed path.
# See docs/component-ownership.md.
#
# Nothing here names a component Gridline could swap. The terminal binding calls
# xdg-terminal-exec, the freedesktop mechanism for "the terminal this system is
# configured to use", so a user changes terminal by registering one rather than
# by editing this file. The lock binding asks logind to lock rather than running
# a locker, so a lock requested from anywhere on the system takes the same path.

# The marker. Nothing in this compositor reports which configuration file it
# loaded, so a session with Gridline's defaults and one without are otherwise
# indistinguishable at runtime. An env entry reaches the environment of every
# process the compositor launches, which makes the question answerable from
# inside the session without reading any file.
env = GRIDLINE_CONFIG,1

# Tiling.
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    rounding = 6
}

# Focus follows the pointer without raising, so moving the mouse across a tiled
# layout does not reorder it.
input {
    follow_mouse = 1
    kb_layout = us
}

misc {
    # Recovery from a lock client that died. Without this the compositor holds
    # the session locked, correctly, but refuses a replacement lock client, and
    # the only way back is another TTY. See docs/security-and-manageability.md.
    allow_session_lock_restore = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

$mod = SUPER

# Launching. Return opens a terminal because that is the binding a tiling user
# reaches for first; the project's own verification kept needing it.
bind = $mod, Return, exec, xdg-terminal-exec
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit

# Locking goes through logind rather than straight to a locker, so the idle
# timeout, this key and anything else on the system all arrive by one route.
#
# Escape rather than the mnemonic L, which is taken: the vim-style focus keys
# below use H, J, K and L, and binding L twice would make one of the two
# silently lose. Leaving $mod SHIFT, L free also leaves room for the vim-style
# move-window bindings a later change will want.
bind = $mod, Escape, exec, loginctl lock-session

# Focus.
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Moving windows within the layout.
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Window state.
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, S, togglesplit

# Workspaces.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Pointer.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
