# Gridline routes this component's start through a program of its own, which
# decides whether to name Gridline's configuration.
#
# ExecStart is cleared before being set because a drop-in otherwise appends to
# the list, and a service with two ExecStart lines runs both.
#
# This file applies to every session on the machine, which is why it names no
# configuration path. The program it names answers that question at start
# time: outside a Gridline session it execs the component with no arguments,
# so this unit behaves exactly as the archive ships it. Nothing else about the
# archive's unit is touched, so the component's own semantics stay in one
# place.
#
# Restart=always rather than the unit's own on-failure, and the notification
# daemon's unit declares no Restart= at all. These components came back when
# killed because the session target upheld them; they are wanted now rather
# than upheld, so restarting is theirs to declare. The start limit is what
# stops a component that cannot start at all: nothing revives it afterwards,
# which is the whole difference between stopping and never having run.
#
# ExecStopPost records how it ended. The starting program cannot: by the time
# a component fails it has already replaced that program, and systemd is the
# only thing left that knows.
[Unit]
# These two live in [Unit] and not in [Service]; systemd ignores them here if
# they are put in the wrong one, which is a limit that silently does nothing.
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/usr/libexec/gridline/gridline-shell wallpaper
ExecStopPost=/usr/libexec/gridline/gridline-component-state stopped wallpaper
Restart=always
RestartSec=2
