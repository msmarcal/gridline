# Gridline follows this component, and changes nothing about how it runs.
#
# Every other drop-in here replaces ExecStart to route a component's start
# through a program of Gridline's. This one does not, and the difference is the
# point: the authentication agent is a component the session refuses to start
# without, so Gridline has no configuration to hand it and no decision to make
# at start time. The only thing missing was that nothing knew when it ended.
#
# Why a drop-in at all. The record the diagnostic reads was written once, by
# the launcher, at session start, and nothing wrote again, so "running" meant
# "was installed when the session began". Measured: the agent died with
# SIGABRT five seconds after the compositor crashed, and the diagnostic went on
# reporting it as running for the rest of the session. Reproduced on purpose by
# stopping the unit, with the same result.
#
# The alternative was having the diagnostic ask systemd for this unit's state
# at report time. That is fewer files and it is the coupling this project
# refuses: the diagnostic's correctness would then depend on the name and the
# internals of a unit another package owns, which is the thing the record
# exists to avoid.
#
# This file applies to every session on the machine, which is the rule the
# other drop-ins follow too. Recording is safe under that rule in a way that
# replacing ExecStart is not: the recorder writes under the session's runtime
# directory and exits zero when there is nothing to write to, so outside a
# Gridline session this unit behaves exactly as the archive ships it.
# Both ends, and the second one is not symmetry for its own sake. With only
# ExecStopPost the record goes from started to stopped and stays there: the
# agent comes back, systemd restarts it, and the diagnostic reports a running
# component as stopped for the rest of the session. That is the same defect as
# the one being fixed here, pointing the other way, and it is worse in one
# respect: a reader sent to the journal for a component that is fine learns to
# stop believing this report.
#
# The other components need no line like this. The three desktop shell ones
# start through a program of Gridline's, which records before it replaces
# itself with the component, and the lock's entry point does the same. This
# unit's ExecStart is the archive's and is deliberately left alone, so there is
# nothing in its start path that could record. systemd is again the only thing
# that knows.
#
# The leading dash matters. Without it a failed recording fails the unit, and
# the authentication agent is a component the session refuses to start without:
# a record would then be able to refuse a session, which inverts the rule that
# recording is never a gate.
[Service]
ExecStartPost=-/usr/libexec/gridline/gridline-component-state record polkit-agent started
ExecStopPost=-/usr/libexec/gridline/gridline-component-state stopped polkit-agent
